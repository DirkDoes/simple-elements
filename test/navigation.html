<!doctype html><html data-theme="dark" data-se-theme="flat"><head><meta charset="utf-8"><link rel="stylesheet" href="../dist/styles.css?v=20261104navtab4"><script defer src="../dist/simple-elements.js?v=20261104navtab4"></script></head><body><pre id="result">Running… Serve this repository over HTTP.</pre><div id="fixtures"></div>
<script type="module">
import { multiScopeExamples } from '../examples/patterns/multi-scope.js?v=20261104navtab4';
const assert = (ok, message) => { if (!ok) throw Error(message); };
const wait = async fn => { const end = Date.now()+10000; while(!fn()){if(Date.now()>end)throw Error('Timed out waiting for preview');await new Promise(r=>setTimeout(r,30));} };
try {
await customElements.whenDefined('se-nav-tab');
const fixtures=document.querySelector('#fixtures');
const crumbs=document.createElement('se-breadcrumbs');crumbs.options=[{label:'<Acme>',href:'#org'},{label:'Website',href:'#web'}];fixtures.append(crumbs);assert(crumbs.querySelectorAll('a').length===1,'Current breadcrumb is not a link');assert(crumbs.textContent.includes('<Acme>'),'Escaped breadcrumb label');
const tabs=document.createElement('nav');tabs.innerHTML='<se-nav-tab label="Overview" href="#a" active></se-nav-tab><se-nav-tab label="Disabled" href="#b" disabled></se-nav-tab>';fixtures.append(tabs);assert(tabs.querySelector('a[aria-current="page"]'),'Active route');assert(tabs.querySelector('button:disabled')&&!tabs.querySelector('a[href="#b"]'),'Disabled route not interactive');
const activeTab=tabs.querySelector('se-nav-tab'), link=activeTab.querySelector('a');link.focus();activeTab.removeAttribute('active');assert(!link.hasAttribute('aria-current')&&document.activeElement===link,'Active changes retain focus and nodes');activeTab.setAttribute('active','');assert(link.getAttribute('aria-current')==='page','Active state synchronizes');
const standalone=document.createElement('se-nav-tab');standalone.setAttribute('label','<Safe>');standalone.setAttribute('badge','<New>');standalone.innerHTML='<span data-se-region="end">Extra</span>';const end=standalone.firstElementChild;fixtures.append(standalone);assert(standalone.querySelector('button')&&standalone.textContent.includes('<Safe>'),'Standalone button and escaped label');assert(standalone.querySelector('.se-nav-tab__badge').textContent==='<New>','Badge accepts and escapes arbitrary text');assert(standalone.querySelector('[data-se-region="end"]')===end,'End region preserves nodes');
for(const variant of ['underline','pill','plain']){standalone.setAttribute('variant',variant);assert(getComputedStyle(standalone.querySelector('button')).borderBottomWidth===(variant==='underline'?'2px':'0px'),'Variant '+variant);}
standalone.setAttribute('variant','pill');standalone.setAttribute('active','');const badge=standalone.querySelector('.se-nav-tab__badge');assert(getComputedStyle(badge).backgroundColor==='rgba(0, 0, 0, 0)','Default active pill badge blends in');standalone.setAttribute('badge-tone','brand');assert(getComputedStyle(badge).backgroundColor!=='rgba(0, 0, 0, 0)','Explicit tone remains on active pill');standalone.querySelector('button').focus();standalone.removeAttribute('badge-tone');assert(getComputedStyle(badge).backgroundColor==='rgba(0, 0, 0, 0)'&&document.activeElement===standalone.querySelector('button'),'Clearing tone keeps focus');standalone.setAttribute('badge','Seen');assert(badge.textContent==='Seen','Badge text updates');standalone.removeAttribute('badge');assert(!standalone.querySelector('.se-nav-tab__badge'),'Badge can be removed');
const sidebar=document.createElement('nav');sidebar.innerHTML='<section><se-nav-item label="Dashboard" icon="dashboard"></se-nav-item><se-nav-group label="Projects" icon="folder"></se-nav-group></section>';fixtures.append(sidebar);sidebar.dataset.seMinimized='true';await new Promise(requestAnimationFrame);
for(const control of sidebar.querySelectorAll('.se-nav-item,.se-nav-group__head > button')){
 control.focus();const tip=control.closest('se-nav-item,se-nav-group').querySelector('[role="tooltip"]');assert(tip.matches(':popover-open'),'Collapsed label tooltip opens on focus');assert(tip.textContent===control.getAttribute('aria-label'),'Tooltip matches label');control.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));assert(!tip.matches(':popover-open'),'Escape dismisses tooltip');control.blur();
}
sidebar.dataset.seMinimized='false';await new Promise(requestAnimationFrame);sidebar.querySelector('.se-nav-item').focus();assert(!sidebar.querySelector(':popover-open'),'Expanded sidebar has no tooltip');
const frames=[];
for(const example of multiScopeExamples){const frame=document.createElement('iframe');frame.style.cssText='width:1024px;height:768px';frame.srcdoc=`<html data-theme="dark" data-se-theme="flat"><head><link rel="stylesheet" href="${new URL('../dist/styles.css?v=20261104navtab4',location.href)}"><script defer src="${new URL('../dist/simple-elements.js?v=20261104navtab4',location.href)}"><\/script></head><body style="margin:0;height:768px">${example.markup}</body></html>`;fixtures.append(frame);frames.push(frame);await wait(()=>frame.contentDocument.querySelector('.mock-content'));}
for(const frame of frames){
 const doc=frame.contentDocument;
 assert(!doc.querySelector('dialog'),'No modal navigation');
 assert(doc.querySelectorAll('.mock-header > se-brand').length===1,'One scope identity in header');
 assert(!doc.querySelector('se-sidebar,se-topbar'),'Application owns native page containers');
 if(!doc.querySelector('.mock-projects'))doc.querySelector('se-breadcrumbs a').click();
 await wait(()=>doc.querySelector('.mock-projects a'));
 doc.querySelector('.mock-projects a[href="#api/overview"]').click();
 assert(doc.querySelector('.mock-page-heading').textContent.includes('Platform API'),'Project card changes scope');
 if(frame===frames[0]){assert(doc.querySelector('.mock-header se-breadcrumbs[variant="header"]'),'Contextual breadcrumbs in header');assert(doc.querySelector('se-brand[compact]'),'Contextual brand compact');assert(!doc.querySelector('main se-breadcrumbs'),'No duplicate breadcrumbs');}
 doc.querySelector('se-nav-tab a[href="#api/settings"]').click();
 assert(doc.querySelector('.mock-page-heading').textContent.includes('Settings'),'Page navigation works');
 assert(!doc.querySelector('se-breadcrumbs').hidden,'Two scopes show breadcrumbs');
 assert(!doc.querySelector('se-breadcrumbs').textContent.includes('Settings'),'Breadcrumbs omit navigation page');
 assert(doc.querySelector('se-breadcrumbs').textContent.includes('Platform API'),'Breadcrumbs show current scope');
 doc.querySelector('se-breadcrumbs a').click();
 assert(doc.querySelector('.mock-projects'),'Breadcrumb returns to directory');
 assert(doc.querySelector('se-breadcrumbs').hidden === (frame !== frames[0]),'Header shows single scope; content breadcrumbs hide it');
 if(frame===frames[0])assert(doc.querySelector('se-brand[compact]'),'Header brand stays compact at organization level');
}
const double=frames[1].contentDocument;
await wait(()=>double.querySelector('.mock-projects a'));double.querySelector('.mock-projects a').click();
assert(double.querySelector('.mock-primary').dataset.seMinimized === 'true','Primary minimizes');
assert(double.querySelector('main se-breadcrumbs'),'Rail keeps content breadcrumbs');
assert(!double.querySelector('se-brand[compact]'),'Rail keeps full brand');
await Promise.all(double.querySelector('.mock-primary').getAnimations().map(a=>a.finished));
frames[1].style.width='390px';
await wait(()=>double.defaultView.getComputedStyle(double.querySelector('.mock-menu')).display !== 'none');
const toggle=double.querySelector('se-panel-toggle button');toggle.click();
assert(!double.querySelector('#scope-navigation').hidden,'Native toggle opens top sidebar');
assert(double.querySelectorAll('#scope-navigation se-nav-section').length===2,'Both chapters are in mobile sidebar');
double.querySelector('#scope-navigation a[href="#org/repositories"]').click();
assert(double.querySelector('.mock-projects'),'Mobile organization route');
assert(double.querySelector('#scope-navigation').hidden,'Mobile menu closes on route');
frames[1].style.width='1024px';
assert(double.querySelector('.mock-primary').dataset.seMinimized === 'false','Organization primary expanded');
document.documentElement.dataset.test='passed';document.querySelector('#result').textContent='PASS: workspace card navigation, breadcrumbs, route tabs, three isolated previews, scope navigation, and minimal page navigation';
}catch(e){document.documentElement.dataset.test='failed';document.querySelector('#result').textContent=e.stack;throw e;}
</script></body></html>
