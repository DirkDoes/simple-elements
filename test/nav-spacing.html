<!doctype html><link rel="stylesheet" href="../dist/styles.css"><script src="../dist/simple-elements.js"></script>
<div class="test-tab-bar"><nav aria-label="Section navigation"><se-nav-tab label="Overview" href="#a" active></se-nav-tab></nav><span data-actions><se-button text="New issue" icon="plus"></se-button></span></div><pre id="result"></pre>
<style>.test-tab-bar{display:flex;align-items:flex-end;gap:20px;border-bottom:1px solid var(--se-border)}.test-tab-bar>nav{display:flex;gap:20px;flex:1;min-width:0;overflow-x:auto}.test-tab-bar>[data-actions]{flex:none;padding:5px 0}</style><script type="module">
const assert=(ok,message)=>{if(!ok)throw Error(message)};
try {
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const tabs=document.querySelector('.test-tab-bar'),action=tabs.querySelector('[data-actions]');
const item=tabs.querySelector('.se-nav-tab'), nav=tabs.querySelector('nav');
const height=item.getBoundingClientRect().height;
assert(Math.abs(tabs.getBoundingClientRect().bottom-item.getBoundingClientRect().bottom-1)<1,'Tab underline meets divider with actions');
action.style.height='80px';
assert(Math.abs(item.getBoundingClientRect().height-height)<1,'Tall action does not stretch tabs');
assert(Math.abs(tabs.getBoundingClientRect().bottom-item.getBoundingClientRect().bottom-1)<1,'Tall action keeps tab against divider');
action.style.height='';

action.remove();
assert(Math.abs(item.getBoundingClientRect().height-height)<1,'Same tab height without actions');
assert(Math.abs(tabs.getBoundingClientRect().bottom-item.getBoundingClientRect().bottom-1)<1,'Same divider spacing without actions');
document.documentElement.dataset.test='passed';document.querySelector('#result').textContent='Passed: tab height and divider spacing with normal, tall, and no actions';
}catch(e){document.documentElement.dataset.test='failed';document.querySelector('#result').textContent=e.stack}
</script>
