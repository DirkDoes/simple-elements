<!doctype html><html><head><link rel="stylesheet" href="../dist/styles.css"><link rel="stylesheet" href="../dist/themes/edge.css"><link rel="stylesheet" href="../dist/themes/studio.css"><script defer src="../dist/simple-elements.js"></script></head><body>
<se-collection type="table" columns="2fr 1fr" dividers="1"><se-list-header><span>Name</span><se-select size="small" options='[{"id":"all","label":"All statuses"},{"id":"ready","label":"Ready"}]'></se-select></se-list-header><se-list-row><se-input value="Name"></se-input><se-button variant="mini" icon="more" aria-label="Actions"></se-button></se-list-row><se-list-row hidden><span>Hidden</span><span>Hidden</span></se-list-row></se-collection><pre id="result"></pre>
<script type="module">
const assert=(x,m)=>{if(!x)throw Error(m)};try{await customElements.whenDefined('se-select');await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const table=document.querySelector('se-collection'),row=table.querySelector('se-list-row'),select=table.querySelector('se-select'),mini=row.querySelector('button.se-button');
for(const theme of ['flat','clean','studio','edge'])for(const mode of ['light','dark']){document.documentElement.dataset.seTheme=theme;document.documentElement.dataset.theme=mode;select.open();const popup=select.querySelector('.se-select__menu');assert(getComputedStyle(popup).paddingLeft==='0px','No native popup inset');const item=popup.querySelector('[role="option"]');assert(Math.abs(item.getBoundingClientRect().width-(popup.clientWidth))<2,'Option spans popup width');select.close();assert(getComputedStyle(row).borderBottomLeftRadius===getComputedStyle(table).borderBottomLeftRadius,'Last visible row corners');assert(getComputedStyle(row.firstElementChild).overflow==='visible','Input focus not clipped');assert(getComputedStyle(select).overflow==='visible','Header control not clipped');assert(mini.offsetWidth===24&&mini.offsetHeight===24,'Mini dimensions');assert(getComputedStyle(table.querySelector('se-list-header > span')).borderRightColor==='rgba(0, 0, 0, 0)','No header divider stroke');const height=row.offsetHeight;mini.focus();assert(row.offsetHeight===height,'Focus does not resize row');}
document.documentElement.dataset.test='passed';document.querySelector('#result').textContent='Control overflow, popup padding, mini sizing and table corners passed in all themes/modes';}catch(e){document.documentElement.dataset.test='failed';document.querySelector('#result').textContent=e.stack}
</script></body></html>
