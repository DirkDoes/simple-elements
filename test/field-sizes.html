<!doctype html><html><head><link rel="stylesheet" href="../dist/styles.css"><link rel="stylesheet" href="../dist/themes/edge.css"><link rel="stylesheet" href="../dist/themes/studio.css"><script defer src="../dist/simple-elements.js"></script></head><body><main></main><pre id="result"></pre>
<script type="module">
const assert=(x,m)=>{if(!x)throw Error(m)},tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try{await customElements.whenDefined('se-input');
const cases=[['input','','input'],['input','type="textarea"','textarea'],['phone-input','','.se-phone__control'],['select','','.se-select__trigger'],['time-picker','','.se-time__trigger'],['date-picker','','.se-date__trigger'],['datetime-picker','','.se-datetime-single__trigger'],['datetime-picker','variant="joined"','.se-date__trigger'],['datetime-picker','variant="separated"','.se-time__trigger'],['color-picker','','.se-color-picker__trigger']];
for(const [tag,attrs,control]of cases){const pair=document.createElement('div');pair.innerHTML=`<se-${tag} ${attrs} size="normal"></se-${tag}><se-${tag} ${attrs} size="small"></se-${tag}>`;document.querySelector('main').append(pair);await tick();for(const theme of ['flat','clean','studio','edge'])for(const mode of ['light','dark']){document.documentElement.dataset.seTheme=theme;document.documentElement.dataset.theme=mode;const normal=pair.children[0].querySelector(control),small=pair.children[1].querySelector(control);assert(small.offsetHeight<normal.offsetHeight,tag+' '+attrs+' '+theme+' compact height '+small.offsetHeight+'/'+normal.offsetHeight);if(tag==='input'&&attrs)assert(parseFloat(getComputedStyle(small).lineHeight)<parseFloat(getComputedStyle(normal).lineHeight),'Textarea line density');}pair.remove();}
for(const count of [8,16,32]){const picker=document.createElement('se-color-picker');picker.setAttribute('variant','palette');picker.setAttribute('palette-size',count);document.body.append(picker);assert(picker.querySelectorAll('[data-color]').length===count,'Palette count');picker.remove();}
document.documentElement.dataset.test='passed';document.querySelector('#result').textContent='Field sizes and palette counts passed across all themes/modes';}catch(e){document.documentElement.dataset.test='failed';document.querySelector('#result').textContent=e.stack}
</script></body></html>
