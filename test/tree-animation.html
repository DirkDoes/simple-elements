<!doctype html><html data-theme="dark"><head><link rel="stylesheet" href="../dist/styles.css"><script defer src="../dist/simple-elements.js"></script></head><body><se-tree-item type="folder" label="Folder" open><se-tree-item label="One"></se-tree-item><se-tree-item label="Two"></se-tree-item></se-tree-item><pre id="result"></pre><script type="module">
const assert=(v,m)=>{if(!v)throw Error(m)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{await customElements.whenDefined('se-tree-item');await wait(200);const details=document.querySelector('details'),summary=details.querySelector('summary'),height=()=>details.getBoundingClientRect().height,expanded=height();summary.click();await wait(60);assert(height()<expanded&&height()>summary.offsetHeight,'Closing interpolates');await wait(180);const closed=height();summary.click();await wait(60);assert(height()>closed&&height()<expanded,'Opening interpolates');await wait(180);assert(Math.abs(height()-expanded)<1,'Returns to intrinsic height');document.documentElement.dataset.test='passed';document.querySelector('#result').textContent='Native folder opening and closing animations passed';}catch(e){document.documentElement.dataset.test='failed';document.querySelector('#result').textContent=e.stack}
</script></body></html>
