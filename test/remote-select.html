<!doctype html><html><head><link rel="stylesheet" href="../dist/styles.css"><script defer src="../dist/simple-elements.js"></script></head><body>
<se-select searchable remote label="Remote people" empty-text="Type at least 3 characters."></se-select>
<se-modal size="medium" title="Dialog title"><se-input label="Name"></se-input></se-modal>
<se-modal title="Small title"></se-modal><pre id="result"></pre>
<script type="module">
const assert=(x,m)=>{if(!x)throw Error(m)},tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try{await customElements.whenDefined('se-select');await tick();const select=document.querySelector('se-select');
for(const multiple of [false,true]){select.toggleAttribute('multiple',multiple);select.value='';select.options=[];select.open();const input=select.querySelector('input[type="search"]');input.focus();let query;const listener=e=>query=e.detail.query;select.addEventListener('search',listener);input.value='may';input.dispatchEvent(new Event('input',{bubbles:true}));assert(query==='may','Search event query');await new Promise(r=>setTimeout(r,20));select.options=[{id:'m',label:'Maya Chen'}];assert(select.querySelector('input[type="search"]')===input&&document.activeElement===input&&input.value==='may','Keep actual focused search input');assert(select.querySelector('.se-select__menu').matches(':popover-open'),'Keep open');select.querySelector('[data-id="m"]').click();assert(multiple?select.value[0]==='m':select.value==='m','Selected value');if(!multiple)assert(!select.querySelector('.se-select__menu').matches(':popover-open'),'Single selection closes');select.options=[{id:'a',label:'Alex'}];assert(select.textContent.includes('Maya Chen'),'Retain selected label between result pages');assert(select.querySelector('input[type="hidden"]').value==='m','Retain submitted value');select.options=[];select.setAttribute('empty-text','Searching…');assert(select.querySelector('.se-select__empty').textContent==='Searching…','Live status message');select.setAttribute('empty-text','<img onerror=alert(1)>');assert(!select.querySelector('.se-select__empty img'),'Message is escaped');select.close();select.removeEventListener('search',listener);}
for(const modal of document.querySelectorAll('se-modal')){modal.open();await tick();assert(modal.querySelector('.se-overlay').getAttribute('title')==='','Overlay suppresses inherited native title');assert(modal.querySelector('[role="dialog"]').getAttribute('aria-label')===modal.getAttribute('title'),'Accessible title retained');const empty=modal.querySelector('.se-empty-state');if(empty)assert(empty.getAttribute('title')==='','Small modal suppresses nested title');modal.close();}
document.documentElement.dataset.test='passed';document.querySelector('#result').textContent='Async single/multiple selection, focus, labels, messages and modal tooltip checks passed';}catch(e){document.documentElement.dataset.test='failed';document.querySelector('#result').textContent=e.stack}
</script></body></html>
