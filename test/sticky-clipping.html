<!doctype html><html><head><link rel="stylesheet" href="../dist/styles.css"><script defer src="../dist/simple-elements.js"></script></head><body><div id="scroll" style="height:300px;overflow:auto;padding:20px;background:pink"><se-collection type="table" columns="1fr 1fr" style="--se-list-header-top:40px"><se-list-header sticky><span>Name</span><span>Size</span></se-list-header></se-collection><div style="height:400px"></div></div><pre id="result"></pre><script type="module">
const assert=(x,m)=>{if(!x)throw Error(m)},tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));try{await customElements.whenDefined('se-list-header');const table=document.querySelector('se-collection'),scroll=document.querySelector('#scroll'),header=table.querySelector('se-list-header');for(let i=0;i<30;i++){const row=document.createElement('se-list-row');row.innerHTML='<span>File '+i+'</span><span>2 KB</span>';table.append(row);}await tick();scroll.scrollTop=250;await tick();const t=table.getBoundingClientRect(),h=header.getBoundingClientRect();assert(table.style.clipPath.startsWith('inset('),'Whole table has clipping boundary');assert(!table.contains(document.elementFromPoint(t.left+10,h.top-5)),'Nothing from table above header');assert(!table.contains(document.elementFromPoint(t.left+1,h.top+1)),'Rounded corner clips table background');assert(header.contains(document.elementFromPoint(t.left+40,h.top+10)),'Header remains visible');header.removeAttribute('sticky');await tick();assert(!table.style.clipPath,'Clipping cleared when sticky removed');document.documentElement.dataset.test='passed';document.querySelector('#result').textContent='Whole-table sticky clipping, rounded corners and cleanup passed';}catch(e){document.documentElement.dataset.test='failed';document.querySelector('#result').textContent=e.stack}
</script></body></html>
