<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../dist/styles.css"><link rel="stylesheet" href="../dist/themes/edge.css"><script defer src="../dist/simple-elements.js"></script><style>body{font-family:system-ui;background:var(--se-bg);color:var(--se-text);padding:24px}#fixture{max-width:720px;margin:auto}</style></head><body><pre id="result">Running</pre><div id="fixture"></div><script type="module">
const assert=(ok,text)=>{if(!ok)throw Error(text);checks++};let checks=0;

player.setAttribute('label','YouTube player demo');player.setAttribute('subtitle','A small frame around the embedded player.');assert(player.querySelector('iframe')===frame,'Caption does not reload iframe');assert(frame.title==='YouTube player demo','Accessible name');assert(!player.querySelector('se-timeline,video'),'No timeline or native video');

for(const theme of ['flat','clean','edge'])for(const mode of ['light','dark']){

 assert(getComputedStyle(player.querySelector('figure')).borderRadius===(theme==='edge'?'0px':'8px'),'Theme radius '+theme+' '+mode);
 player.style.width='280px';assert(frame.getBoundingClientRect().height>=200,'Small player minimum');assert(player.scrollWidth<=280,'No narrow overflow');player.style.width='';
}
