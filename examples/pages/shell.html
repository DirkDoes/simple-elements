<!doctype html>
<html lang="en" data-theme="light" data-se-theme="flat">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Elements</title>
    <link rel="stylesheet" href="../dist/styles.css?v=20261104categories1">
    <link rel="stylesheet" href="./example.css?v=20261104categories1">
    <link rel="stylesheet" href="../dist/themes/edge.css?v=20261104categories1">
    <script defer src="../dist/simple-elements.js?v=20261104categories1"></script>
    <script type="module" src="./example.js?v=20261104categories1"></script>
  </head>
  <body>
    <div class="demo-shell">
      <main class="demo-main">
        <header class="demo-topbar"><section data-start><se-panel-toggle for="example-sidebar" variant="menu" class="demo-mobile" label="Toggle navigation"></se-panel-toggle><se-brand label="Simple Elements" icon="package" href="#dashboard"></se-brand></section><section class="demo-global-search" role="search" aria-label="Components"><se-input type="search" aria-label="Search components" placeholder="Search components…"></se-input></section><section data-end><se-color-picker class="demo-brand-color" label="Primary color" name="theme[primary]" value="#2563eb"></se-color-picker><se-select class="demo-theme-family" label="Theme" value="flat" options='[{"id":"flat","label":"Flat"},{"id":"clean","label":"Clean"},{"id":"edge","label":"Edge"}]'></se-select><se-theme-switch class="demo-theme" variant="button" label="Color mode"></se-theme-switch></section></header>
        <div class="demo-body">
          <nav id="example-sidebar" class="demo-sidebar" data-mobile-navigation aria-label="Showcase">
            <section>
              <se-nav-section title="Overview"><se-nav-item label="Dashboard" icon="dashboard" href="#dashboard"></se-nav-item></se-nav-section>
              <se-nav-section title="Components" data-component-section collapsible></se-nav-section>
              <se-nav-section title="Patterns" data-pattern-section collapsible></se-nav-section>
            </section>
            <footer><small class="demo-version" aria-label="Latest released version"></small></footer>
          </nav>
          <se-resize-handle for="example-sidebar" min="210" max="380" label="Showcase navigation width"></se-resize-handle>
          <div class="demo-scroll">
            <div class="demo-content">
          <!-- page:dashboard -->

          <!-- page:input -->
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
